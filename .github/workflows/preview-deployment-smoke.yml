name: Preview deployment smoke
on:
  push:
    branches:
      - feature/interactive-functional-v6
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate live beta preview routes and newest release UI
        env:
          URL: https://feature-interactive-function.hustle-mn-preview.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --max-time 20 "$URL/" | grep -q 'Hustle'; then break; fi
            if [ "$attempt" = 12 ]; then echo "::error::Preview not ready"; exit 1; fi
            sleep 10
          done
          for route in / /explore/ /login/ /buyer/ /seller-studio/ /admin/ /faq/ /about/ /privacy/ /terms/ /contact/; do
            code=$(curl -L -s -o /dev/null --max-time 20 -w '%{http_code}' "$URL$route")
            echo "$route => $code"
            test "$code" = 200
          done
          # Real service markup may be hydrated after load; route success is not browser E2E.
          echo "HTTP route availability confirmed. Authenticated E2E and live visual release confirmation must be separately signed off."
