name: Hustle beta quality gates

on:
  pull_request:
    branches:
      - main
      - feature/interactive-functional-v6
      - fix/auth-portfolio-security-20261020
  push:
    branches:
      - feature/preview-smart-search-20261021

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and security tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Runtime build
        run: npm run build
      - name: Static Cloudflare preview build
        run: npm run build:preview

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Build static preview for deterministic browser testing
        run: npm run build:preview
      - name: Run real browser tests with mocked external auth/data
        run: npx playwright test
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v24-browser-qa
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
