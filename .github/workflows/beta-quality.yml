name: Hustle beta quality gates

on:
  pull_request:
    branches:
      - main
      - feature/interactive-functional-v6
      - fix/auth-portfolio-security-20261020
  push:
    branches:
      - fix/ssr-auth-session-20261021

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and security tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Runtime build
        run: npm run build
      - name: Static Cloudflare preview build
        run: npm run build:preview
