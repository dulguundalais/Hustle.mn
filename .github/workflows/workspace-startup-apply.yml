name: Apply scoped workspace startup fix
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/workspace-startup-apply.yml']
permissions:
  contents: read
jobs:
  apply-startup-fix:
    if: github.head_ref == 'codex/fix-workspace-startup-20261030' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact reviewed five-line startup guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object components/workspace.tsx)" = fa38e8051a7d7f5ea944a45add858287cfbd5187
          python3 - <<'PY'
          from pathlib import Path
          p = Path("components/workspace.tsx")
          text = p.read_text()
          old = " await load();\n await routeSignedIn();\n"
          new = (" // Do not expose navigation until both the workspace data and its initial route\n"
                 " // are ready: late startup work must not overwrite a conversation just opened.\n"
                 " setLoading(true);\n"
                 " try{\n"
                 " await load();\n"
                 " await routeSignedIn();\n"
                 " }finally{setLoading(false)}\n")
          assert text.count(old) == 1, "Unexpected source; refuse broad replacement"
          p.write_text(text.replace(old, new))
          PY
          git rm -- .github/workflows/workspace-startup-apply.yml
          git add components/workspace.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep workspace loading until post-login data and routing are ready"
          git push origin HEAD:refs/heads/codex/fix-workspace-startup-20261030
          echo "Applied commit: $(git rev-parse HEAD)"
          echo "Applied tree: $(git rev-parse HEAD^{tree})"
