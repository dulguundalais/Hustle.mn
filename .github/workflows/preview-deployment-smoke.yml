name: Preview deployment smoke
on:
  push:
    branches:
      - feature/interactive-functional-v6
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Confirm V26 marker reached real Cloudflare Pages preview
        env:
          URL: https://feature-interactive-function.hustle-mn-preview.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 22); do
            if curl --fail --location --silent --max-time 20 -o /tmp/hustle-v26.json "$URL/v26-release.json" && node -e "const x=require('/tmp/hustle-v26.json');if(x.version!=='V26'||x.channel!=='closed-beta-preview')process.exit(1)"; then
              echo "V26 marker served by Cloudflare"
              break
            fi
            if [ "$attempt" = 22 ]; then echo "::error::V26 marker not deployed"; exit 1; fi
            sleep 15
          done
          for path in / /explore/ /login/ /auth/reset/ /buyer/ /seller-studio/ /admin/ /faq/ /about/ /privacy/ /terms/ /contact/; do
            code=$(curl --location --silent --max-time 20 -o /dev/null -w '%{http_code}' "$URL$path")
            echo "$path => $code"
            test "$code" = "200"
          done
          echo "HTTP and V26 deploy marker PASS; actual email delivery and authenticated live browser E2E require manual verification."
